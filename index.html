<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Princess Day 👑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top">
    <button class="glass" id="bMusic">🎵 Music: off</button>
    <button class="glass" id="bAuto">🎬 Auto tour</button>
    <button class="glass" id="bDrone">🚁 Drone view</button>
  </div>
  <div class="bar" id="barT"></div>
  <div class="bar" id="barB"></div>
  <div id="cap"></div>
  <div id="fade"></div>
  <button id="prompt" class="glass"></button>
  <div id="hint" class="glass">WASD / arrows to walk · drag to look · click ground to walk</div>
  <div id="joy"><div id="knob"></div></div>

  <div id="intro" class="overlay show">
    <div class="card">
      <h1 id="introT"></h1>
      <p>A little kingdom, made just for you.
Walk around, find the surprises, and make a wish. ✨</p>
      <button id="go">Enter the kingdom</button>
      <button id="goTour">🎬 Auto tour</button>
    </div>
  </div>

  <div id="modal" class="overlay">
    <div class="card">
      <h2>A wish for you ✨</h2>
      <p id="note"></p>
      <button id="close">Close</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
